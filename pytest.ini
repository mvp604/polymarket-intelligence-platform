[pytest]
minversion = 8.0
testpaths =
    tests
pythonpath =
    .
python_files =
    test_*.py
python_classes =
    Test*
python_functions =
    test_*
norecursedirs =
    .git
    .venv
    __pycache__
    backups
    artifacts
    reports
    docs
    runtime
    sprints
addopts =
    --strict-markers


